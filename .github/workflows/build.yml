name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download ARCore (for 6DoF)
        run: |
          META=$(curl -fsSL https://dl.google.com/android/maven2/com/google/ar/core/maven-metadata.xml)
          V=$(echo "$META" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          echo "ARCore version: $V"
          curl -fsSL -o arcore.aar "https://dl.google.com/android/maven2/com/google/ar/core/$V/core-$V.aar"
          unzip -l arcore.aar

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > stereocam.keystore
            echo "Using the saved signing key, so this APK updates the installed app."
          else
            echo "::warning::No KEYSTORE_B64 secret set. This build uses a throwaway key and won't install over an existing StereoCam."
          fi

      - name: Build
        run: ARCORE_AAR=arcore.aar bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: StereoCam-apk
          path: build/StereoCam.apk
